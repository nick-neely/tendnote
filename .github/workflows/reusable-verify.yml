name: Reusable verify

on:
  workflow_call:
    inputs:
      run_database:
        description: Run migration drift and clean replay checks
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.32.1
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-with-at-least-32-characters
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DATABASE_URL: postgresql://tendnote:tendnote@localhost:5432/tendnote
  REDIS_URL: redis://localhost:6379
  TENDNOTE_ENV: ci
  TURBO_DAEMON: "false"
  TURBO_TELEMETRY_DISABLED: "1"
  TMPDIR: /tmp

jobs:
  database:
    name: Database
    if: inputs.run_database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: tendnote
          POSTGRES_USER: tendnote
          POSTGRES_PASSWORD: tendnote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tendnote -d tendnote"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migration drift
        run: pnpm db:check

      - name: Replay migrations
        run: pnpm db:migrate

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test_fallow:
    name: Test and Fallow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This is the canonical CI test pass. Fallow uses its Istanbul map for
      # exact per-function CRAP scores, so running a second non-coverage test
      # job would repeat the same suites without adding another behavior gate.
      # Workspaces stay serial within this two-core runner; concurrent Vitest
      # processes can destabilize async DOM tests under coverage.
      - name: Run tests with coverage
        run: pnpm coverage:ci

      - name: Confirm exact CRAP scoring
        run: pnpm fallow:coverage:check

      - name: Run Fallow audit
        run: pnpm fallow:ci

  verify:
    name: Verify
    runs-on: ubuntu-latest
    if: always()
    needs:
      - database
      - quality
      - test_fallow
    steps:
      - name: Check verification results
        run: |
          if [[ "${{ needs.quality.result }}" != "success" || "${{ needs.test_fallow.result }}" != "success" ]]; then
            echo "Quality or test-and-Fallow verification did not succeed."
            exit 1
          fi

          if [[ "${{ inputs.run_database }}" == "true" && "${{ needs.database.result }}" != "success" ]]; then
            echo "Database verification was required but did not succeed. Result: ${{ needs.database.result }}"
            exit 1
          fi

          echo "Verification passed."
