name: Reusable verify

on:
  workflow_call:
    inputs:
      run_tests:
        description: Run the unit-test lane
        required: false
        type: boolean
        default: true
      run_browser:
        description: Run the focused real-browser component contracts
        required: false
        type: boolean
        default: true
      run_instant:
        description: Run the production-build Instant Interaction matrix
        required: false
        type: boolean
        default: true
      run_database:
        description: Run migration drift and clean replay checks
        required: false
        type: boolean
        default: true
      run_full:
        description: Replace fast tests with coverage-backed Fallow and browser qualification
        required: false
        type: boolean
        default: false
      full_browser_matrix:
        description: >-
          Run the full upgrade-and-promotion browser matrix (adds reduced Firefox
          and WebKit smoke) instead of the routine Chromium tier. ADR 0210 keeps
          these tiers separate so an ordinary application pull request does not
          pay a three-engine tax.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.32.1
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-with-at-least-32-characters
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DATABASE_URL: postgresql://tendnote:tendnote@localhost:5432/tendnote
  REDIS_URL: redis://localhost:6379
  TENDNOTE_ENV: ci
  TURBO_DAEMON: "false"
  TURBO_TELEMETRY_DISABLED: "1"
  TMPDIR: /tmp

jobs:
  database:
    name: Database
    if: inputs.run_database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: tendnote
          POSTGRES_USER: tendnote
          POSTGRES_PASSWORD: tendnote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tendnote -d tendnote"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migration drift
        run: pnpm db:check

      - name: Replay migrations
        run: pnpm db:migrate

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  fast_tests:
    name: Fast affected tests
    if: ${{ inputs.run_tests && !inputs.run_full }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run affected tests
        run: pnpm test:affected

  test_fallow:
    name: Test and Fallow
    if: ${{ (inputs.run_tests || inputs.run_browser) && inputs.run_full }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ inputs.run_browser }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium and system dependencies
        if: ${{ inputs.run_browser && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: pnpm --filter @tendnote/web exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: ${{ inputs.run_browser && steps.playwright-cache.outputs.cache-hit == 'true' }}
        run: pnpm --filter @tendnote/web exec playwright install-deps chromium

      # This is the canonical CI test pass. Fallow uses the merged V8 map for
      # exact per-function CRAP scores, so running a second non-coverage test
      # job would repeat the same suites without adding another behavior gate.
      # Workspaces stay serial within this two-core runner; concurrent Vitest
      # processes can destabilize async DOM tests under coverage.
      - name: Run tests with coverage
        if: ${{ inputs.run_tests }}
        run: pnpm coverage:ci

      - name: Confirm exact CRAP scoring
        if: ${{ inputs.run_tests }}
        run: pnpm fallow:coverage:check

      # Without an explicit base Fallow resolves one from the branch's own
      # upstream, which on a pushed branch is the branch itself — the audit then
      # reports almost nothing and the gate passes while blind. `fetch-depth: 0`
      # above is what makes `origin/main` resolvable here.
      - name: Run Fallow audit
        if: ${{ inputs.run_tests }}
        env:
          FALLOW_AUDIT_BASE: origin/main
        run: pnpm fallow:ci

      # A four-contract Chromium suite closes the layout-engine gap that jsdom cannot:
      # phone-width reflow/overflow, lifecycle hit areas, and real scroll/focus/pulse.
      - name: Run real-browser contracts
        if: ${{ inputs.run_browser }}
        run: pnpm test:browser

  # The Instant Interaction contract (#310, ADR 0210). A separate job rather than
  # more steps in Test and Fallow: it must run *alongside* the existing critical
  # path so protecting navigation does not lengthen every pull request, and the
  # aggregate Verify wall time has to stay under nine minutes.
  instant_matrix:
    name: Instant matrix
    if: ${{ inputs.run_full && inputs.run_instant }}
    runs-on: ubuntu-latest
    # The rollout criterion is a wall-time one. Without this a hung `next start`
    # would sit on GitHub's six-hour default instead of failing the gate.
    #
    # The full tier gets longer because its first run is a guaranteed cache miss
    # (its Playwright cache key is `all`, not `chromium`) that installs three
    # engines with system dependencies before it builds — and that first run is
    # the mandatory WebKit evidence, so it must not be the run that times out.
    timeout-minutes: ${{ inputs.full_browser_matrix && 30 || 15 }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: tendnote
          POSTGRES_USER: tendnote
          POSTGRES_PASSWORD: tendnote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tendnote -d tendnote"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    # The measured build exposes Next's instant-navigation testing API, and the
    # tier selects the browser projects. Both are set by the package scripts
    # below rather than here, so there is one place to read them from.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Chromium
        id: playwright-cache-chromium
        if: ${{ !inputs.full_browser_matrix }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Cache promotion browsers
        id: playwright-cache-all
        if: ${{ inputs.full_browser_matrix }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-all-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install browsers
        if: >-
          (!inputs.full_browser_matrix && steps.playwright-cache-chromium.outputs.cache-hit != 'true') ||
          (inputs.full_browser_matrix && steps.playwright-cache-all.outputs.cache-hit != 'true')
        run: pnpm --filter @tendnote/web exec playwright install --with-deps ${{ inputs.full_browser_matrix && 'chromium firefox webkit' || 'chromium' }}

      - name: Install browser system dependencies
        if: >-
          (!inputs.full_browser_matrix && steps.playwright-cache-chromium.outputs.cache-hit == 'true') ||
          (inputs.full_browser_matrix && steps.playwright-cache-all.outputs.cache-hit == 'true')
        run: pnpm --filter @tendnote/web exec playwright install-deps ${{ inputs.full_browser_matrix && 'chromium firefox webkit' || 'chromium' }}

      - name: Run the routine Chromium matrix
        if: ${{ !inputs.full_browser_matrix }}
        run: pnpm test:instant

      - name: Run the full upgrade and promotion matrix
        if: ${{ inputs.full_browser_matrix }}
        run: pnpm test:instant:full

      - name: Summarise recorded diagnostics
        if: always()
        run: node scripts/summarize-instant-diagnostics.mjs >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      # The step summary above is for a human and is not retrievable through the
      # API, so on its own a green run leaves no record of how close it came
      # (#331). The same rows go to the job log as `INSTANT_MARGIN` JSON, which
      # is retrievable, greppable, and kept for as long as the run is.
      - name: Publish measured margins to the job log
        if: always()
        run: node scripts/summarize-instant-diagnostics.mjs --format=margins
        continue-on-error: true

      # On success as well as failure. Traces below answer "why did this break";
      # this answers "how much headroom has this row been losing", which only has
      # an answer if the passing runs are kept too.
      - name: Upload recorded diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instant-matrix-diagnostics
          path: |
            apps/web/.instant/diagnostics.jsonl
            apps/web/.instant/uncovered-engines.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instant-matrix-traces
          path: apps/web/.instant/test-results
          retention-days: 7
