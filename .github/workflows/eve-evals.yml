name: Run Eve model evaluations

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA to evaluate and preserve
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: eve-model-evaluations
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.32.1
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-with-at-least-32-characters
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DATABASE_URL: postgresql://tendnote:tendnote@localhost:5432/tendnote
  # Declared because the agent this workflow boots builds its Better Auth and
  # rate-limit clients against it. Both connect lazily, so an eval run normally
  # touches neither - but a declared URL with nothing behind it turns any code
  # path that does into a connect timeout deep inside an eval, which reads as a
  # broken eval. The service below makes the declaration true.
  REDIS_URL: redis://localhost:6379
  TENDNOTE_ENV: ci
  TURBO_DAEMON: "false"
  TURBO_TELEMETRY_DISABLED: 1
  TMPDIR: /tmp
  AGENT_MODEL: ${{ vars.TENDNOTE_AGENT_MODEL || 'google/gemini-3.7-flash' }}

jobs:
  evaluate:
    name: Eve model evaluations
    # On-demand rather than spot: the bound below exceeds the hour in which AWS
    # does not bill an interrupted spot instance, and an interruption late in a
    # run discards the model credits it already spent.
    runs-on: runs-on=${{ github.run_id }}-eve-evals/runner=deploy
    # The deterministic tag runs one eval at a time against a live model. The
    # publication gate is first-sample-only: a failure remains a failure and is
    # never resampled inside this paid workflow.
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: tendnote
          POSTGRES_USER: tendnote
          POSTGRES_PASSWORD: tendnote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tendnote -d tendnote"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      TENDNOTE_EVAL_DATABASE_URL: postgresql://tendnote:tendnote@localhost:5432/tendnote_eval
    steps:
      - name: Set up RunsOn
        uses: runs-on/action@v2

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Verify exact candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run the qualifying sample directly instead of the diagnostic retry
      # wrapper. A non-zero strict result remains non-zero, and no paid model
      # request is repeated by this workflow.
      - name: Run Eve model evaluations
        id: evaluate
        continue-on-error: true
        working-directory: apps/agent
        run: |
          node scripts/require-model-credentials.mjs deterministic
          pnpm eval:prepare
          set +e
          DATABASE_URL="$TENDNOTE_EVAL_DATABASE_URL" TENDNOTE_AGENT_MODEL="$AGENT_MODEL" \
            pnpm exec eve eval --tag deterministic --strict --skip-report \
            --max-concurrency 1 --junit .eve/evals/junit.xml
          status=$?
          mkdir -p .eve/evals
          echo "$status" > .eve/evals/exit-code.txt
          exit "$status"
        timeout-minutes: 75

      - name: Package immutable repository evidence
        if: always()
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          node apps/agent/scripts/package-deterministic-evidence.mjs
          --source-sha "$CANDIDATE_SHA"
          --exit-code-file apps/agent/.eve/evals/exit-code.txt
          --workflow-url "$WORKFLOW_URL"
          --command "pnpm exec eve eval --tag deterministic --strict --skip-report --max-concurrency 1 --junit .eve/evals/junit.xml"
          --agent-model "$AGENT_MODEL"

      - name: Upload Eve evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eve-model-evaluations-${{ inputs.candidate_sha }}
          path: |
            apps/agent/.eve/evals/
            evidence/evals/${{ inputs.candidate_sha }}/

      - name: Enforce clean evaluation result
        if: always() && steps.evaluate.outcome != 'success'
        run: exit 1
