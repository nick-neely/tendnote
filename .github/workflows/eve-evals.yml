name: Run Eve model evaluations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eve-model-evaluations
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.32.1
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-with-at-least-32-characters
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DATABASE_URL: postgresql://tendnote:tendnote@localhost:5432/tendnote
  REDIS_URL: redis://localhost:6379
  TENDNOTE_ENV: ci
  TURBO_DAEMON: "false"
  TURBO_TELEMETRY_DISABLED: 1
  TMPDIR: /tmp

jobs:
  evaluate:
    name: Eve model evaluations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: tendnote
          POSTGRES_USER: tendnote
          POSTGRES_PASSWORD: tendnote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tendnote -d tendnote"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      TENDNOTE_EVAL_DATABASE_URL: postgresql://tendnote:tendnote@localhost:5432/tendnote_eval
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Eve model evaluations
        run: pnpm --filter @tendnote/agent eval:deterministic

      - name: Upload Eve evaluation artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: eve-model-evaluations
          path: apps/agent/.eve/evals/
