name: Run Eve model evaluations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eve-model-evaluations
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.32.1
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-with-at-least-32-characters
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DATABASE_URL: postgresql://tendnote:tendnote@localhost:5432/tendnote
  # Declared because the agent this workflow boots builds its Better Auth and
  # rate-limit clients against it. Both connect lazily, so an eval run normally
  # touches neither - but a declared URL with nothing behind it turns any code
  # path that does into a connect timeout deep inside an eval, which reads as a
  # broken eval. The service below makes the declaration true.
  REDIS_URL: redis://localhost:6379
  TENDNOTE_ENV: ci
  TURBO_DAEMON: "false"
  TURBO_TELEMETRY_DISABLED: 1
  TMPDIR: /tmp

jobs:
  evaluate:
    name: Eve model evaluations
    runs-on: ubuntu-latest
    # The deterministic tag runs one eval at a time against a live model, and
    # resamples every failure twice. This is a manual-dispatch workflow, so the
    # bound is here to stop a hung run from burning an hour of minutes, not to
    # pace a healthy one.
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: tendnote
          POSTGRES_USER: tendnote
          POSTGRES_PASSWORD: tendnote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tendnote -d tendnote"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      TENDNOTE_EVAL_DATABASE_URL: postgresql://tendnote:tendnote@localhost:5432/tendnote_eval
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Exit 3 means no eval failed outright but at least one only passed on
      # retry. That fails the step on purpose: a deterministic gate that needs a
      # second sample is not clean, and the artifacts below say which one.
      - name: Run Eve model evaluations
        run: pnpm --filter @tendnote/agent eval:deterministic
        timeout-minutes: 75

      - name: Upload Eve evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eve-model-evaluations
          path: apps/agent/.eve/evals/
