name: Promotion verify

# The upgrade-and-promotion verification tier (ADR 0210, ADR 0211).
#
# The same verification definition routine pull requests run, with one input
# flipped: the Instant Interaction matrix adds the reduced Firefox and WebKit
# smoke. ADR 0210 keeps that off every application pull request, so it needs a
# deliberate trigger rather than an event — and it has two, because a framework
# upgrade needs it before its own pull request can merge:
#
#   * `labeled` — apply the `full-browser-matrix` label to the pull request. A
#     `pull_request` workflow is defined by the head branch, so this works on a
#     candidate branch that is not on `main` yet. This is the trigger the
#     framework upgrade itself uses. Note what it verifies: the run checks out
#     the *merge* ref, head merged into base, so a later move on `main`
#     invalidates the result as surely as a push to the branch does.
#   * `workflow_dispatch` — Actions → Promotion verify → Run workflow, against
#     any branch. GitHub only offers this for workflows that exist on the
#     default branch, so it becomes available once this file has landed, and it
#     is what re-promotions and later candidates use.
#
# It is a separate workflow rather than a path bolted onto `pr-verify` because
# that workflow's change detection and concurrency group are both keyed on a
# pull-request number and it always requests the routine tier.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - labeled

permissions:
  contents: read

concurrency:
  # The branch, not `github.ref`: a labeled event reports `refs/pull/N/merge`
  # and a dispatch reports `refs/heads/<branch>`, so keying on the ref would let
  # the same branch run two three-engine matrices against each other.
  group: promotion-verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    # A dispatch has no label; a labeled event must carry the right one.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'full-browser-matrix'
    uses: ./.github/workflows/reusable-verify.yml
    with:
      run_database: true
      run_full: true
      full_browser_matrix: true

  gate:
    name: Promotion verify
    needs: verify
    if: always() && needs.verify.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Check promotion verification
        run: |
          if [[ "${{ needs.verify.result }}" != "success" ]]; then
            echo "Full-matrix verification did not succeed. Result: ${{ needs.verify.result }}"
            exit 1
          fi

          echo "Promotion verification gate passed."
