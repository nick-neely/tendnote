name: Prime Playwright cache

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: playwright-cache-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.32.1

jobs:
  chromium:
    name: Prime Chromium cache
    # x64, because this primes the cache entry the verification jobs restore and
    # the key is architecture-scoped.
    runs-on: runs-on=${{ github.run_id }}-playwright-cache/runner=default
    timeout-minutes: 15
    steps:
      - name: Set up RunsOn
        uses: runs-on/action@v2

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Chromium
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @tendnote/web exec playwright install chromium
