name: Release production

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready

permissions:
  actions: read
  contents: read
  statuses: write

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.32.1

concurrency:
  group: production-release-${{ github.event.client_payload.project.id }}
  cancel-in-progress: false

jobs:
  # A job-level `if` silently reports success when its condition is false. That
  # is unsafe for a production migration gate: a deleted or misspelled project
  # variable would let the deployment stay un-migrated without any failed job.
  # Validate the dispatch first so non-target lifecycle events remain harmless,
  # while a production release with bad project configuration fails loudly.
  validate:
    name: Validate production release event
    runs-on: >-
      ${{ format('runs-on={0}-production-release-validate/runner=light', github.run_id) }}
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.validate.outputs.should_release }}
    steps:
      - name: Set up RunsOn
        uses: runs-on/action@46910bf61b41721b0579f237e186afb35477007a # v2.3.0

      - name: Checkout validation script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate dispatch payload
        id: validate
        env:
          VERCEL_EVENT_ENVIRONMENT: ${{ github.event.client_payload.environment }}
          VERCEL_EVENT_PROJECT_ID: ${{ github.event.client_payload.project.id }}
          VERCEL_EVENT_REF: ${{ github.event.client_payload.git.ref }}
          VERCEL_EVENT_STATE: ${{ github.event.client_payload.state.type }}
          VERCEL_EXPECTED_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: node scripts/production-release-event.mjs "$GITHUB_OUTPUT"

  report_invalid:
    name: Report invalid production release event
    needs: validate
    if: ${{ always() && needs.validate.result == 'failure' }}
    runs-on: >-
      ${{ format('runs-on={0}-production-release-invalid/runner=light', github.run_id) }}
    timeout-minutes: 5
    steps:
      - name: Set up RunsOn
        uses: runs-on/action@46910bf61b41721b0579f237e186afb35477007a # v2.3.0

      # The status action's post step sees the deliberate failure below and
      # turns the Vercel Deployment Check red instead of leaving it pending.
      - name: Report migration status to Vercel
        uses: vercel/repository-dispatch/actions/status@30f760c6640485cd92f8c785ef361382555fb712 # v1
        with:
          name: Production Release Gate

      - name: Fail the invalid release gate
        run: |
          echo "::error title=Production migration gate::Validation failed; see the Validate production release event job for the configuration error."
          exit 1

  release:
    name: Production Release Gate
    needs: validate
    if: needs.validate.outputs.should_release == 'true'
    # On-demand, so nothing can interrupt the runner partway through applying
    # migrations to the production database.
    runs-on: runs-on=${{ github.run_id }}-release/runner=deploy
    timeout-minutes: 15
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_DIRECT_URL }}
      DEPLOY_SHA: ${{ github.event.client_payload.git.sha }}
    steps:
      - name: Set up RunsOn
        uses: runs-on/action@46910bf61b41721b0579f237e186afb35477007a # v2.3.0

      - name: Report migration status to Vercel
        uses: vercel/repository-dispatch/actions/status@30f760c6640485cd92f8c785ef361382555fb712 # v1
        with:
          name: Production Release Gate

      - name: Checkout deployed revision
        uses: vercel/repository-dispatch/actions/checkout@30f760c6640485cd92f8c785ef361382555fb712 # v1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install database dependencies
        run: pnpm install --frozen-lockfile --filter @tendnote/db...

      - name: Apply pending production migrations
        run: pnpm db:migrate

      - name: Summarize release gate
        env:
          DEPLOYMENT_URL: ${{ github.event.client_payload.url }}
        run: |
          {
            echo "## Production release gate"
            echo
            echo "- Deployment: ${DEPLOYMENT_URL}"
            echo "- Revision: \`${DEPLOY_SHA}\`"
            echo "- Pending database migrations applied"
          } >>"${GITHUB_STEP_SUMMARY}"
