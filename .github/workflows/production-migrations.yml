name: Release production

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready

permissions:
  actions: read
  contents: read
  statuses: write

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.32.1

concurrency:
  group: production-release-${{ github.event.client_payload.project.id }}
  cancel-in-progress: false

jobs:
  release:
    name: Production Release Gate
    if: >-
      github.event.client_payload.environment == 'production' &&
      github.event.client_payload.project.id == vars.VERCEL_PROJECT_ID &&
      github.event.client_payload.git.ref == 'main' &&
      github.event.client_payload.state.type == 'ready'
    # On-demand, so nothing can interrupt the runner partway through applying
    # migrations to the production database.
    runs-on: runs-on=${{ github.run_id }}-release/runner=deploy
    timeout-minutes: 15
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_DIRECT_URL }}
      DEPLOY_SHA: ${{ github.event.client_payload.git.sha }}
    steps:
      - name: Set up RunsOn
        uses: runs-on/action@46910bf61b41721b0579f237e186afb35477007a # v2.3.0

      - name: Report migration status to Vercel
        uses: vercel/repository-dispatch/actions/status@30f760c6640485cd92f8c785ef361382555fb712 # v1
        with:
          name: Production Release Gate

      - name: Checkout deployed revision
        uses: vercel/repository-dispatch/actions/checkout@30f760c6640485cd92f8c785ef361382555fb712 # v1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install database dependencies
        run: pnpm install --frozen-lockfile --filter @tendnote/db...

      - name: Apply pending production migrations
        run: pnpm db:migrate

      - name: Summarize release gate
        env:
          DEPLOYMENT_URL: ${{ github.event.client_payload.url }}
        run: |
          {
            echo "## Production release gate"
            echo
            echo "- Deployment: ${DEPLOYMENT_URL}"
            echo "- Revision: \`${DEPLOY_SHA}\`"
            echo "- Pending database migrations applied"
          } >>"${GITHUB_STEP_SUMMARY}"
