name: Verify and migrate production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-migrations
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.filter.outputs.verify }}
      database: ${{ steps.filter.outputs.database }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            verify:
              - '.github/workflows/**'
              - '.fallowrc*'
              - 'apps/**'
              - 'packages/**'
              - 'docs/**'
              - 'public/**'
              - 'README.md'
              - 'biome.json'
              - 'components.json'
              - 'docker-compose.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
            database:
              - 'packages/db/src/schema/**'
              - 'packages/db/migrations/**'
              - 'packages/db/drizzle.config.ts'
              - 'packages/db/package.json'

  verify:
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    uses: ./.github/workflows/reusable-verify.yml
    secrets: inherit

  migrate:
    name: Migrate production
    runs-on: ubuntu-latest
    needs:
      - changes
      - verify
    if: needs.changes.outputs.database == 'true' && needs.verify.result == 'success'
    environment: production
    env:
      NODE_VERSION: 24
      PNPM_VERSION: 10.32.1
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_DIRECT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

  release-gate:
    name: Production Release Gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - verify
      - migrate
    if: always()
    steps:
      - name: Check production release prerequisites
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Change detection failed."
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.verify }}" == "true" && "${{ needs.verify.result }}" != "success" ]]; then
            echo "Verification was required but did not succeed. Result: ${{ needs.verify.result }}"
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.database }}" == "true" && "${{ needs.migrate.result }}" != "success" ]]; then
            echo "Production migration was required but did not succeed. Result: ${{ needs.migrate.result }}"
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.verify }}" != "true" ]]; then
            echo "No verification paths changed."
          fi

          if [[ "${{ needs.changes.outputs.database }}" != "true" ]]; then
            echo "No production database migration required."
          fi

          echo "Production release gate passed."
