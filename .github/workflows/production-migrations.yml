name: Release production

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready

permissions:
  actions: read
  contents: read
  statuses: write

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.32.1

concurrency:
  group: production-release-${{ github.event.client_payload.project.id }}
  cancel-in-progress: false

jobs:
  release:
    name: Production Release Gate
    if: >-
      github.event.client_payload.environment == 'production' &&
      github.event.client_payload.project.id == 'prj_hdGusP01mnLoDvQc3CQ1gha2at7E' &&
      github.event.client_payload.git.ref == 'main' &&
      github.event.client_payload.state.type == 'ready'
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_DIRECT_URL }}
      DEPLOY_SHA: ${{ github.event.client_payload.git.sha }}
    steps:
      - name: Report migration status to Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: Production Release Gate

      - name: Checkout deployed revision
        uses: vercel/repository-dispatch/actions/checkout@v1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install database dependencies
        run: pnpm install --frozen-lockfile --filter @tendnote/db...

      - name: Apply pending production migrations
        run: pnpm db:migrate

      - name: Summarize release gate
        env:
          DEPLOYMENT_URL: ${{ github.event.client_payload.url }}
        run: |
          {
            echo "## Production release gate"
            echo
            echo "- Deployment: ${DEPLOYMENT_URL}"
            echo "- Revision: \`${DEPLOY_SHA}\`"
            echo "- Pending database migrations applied"
          } >>"${GITHUB_STEP_SUMMARY}"
