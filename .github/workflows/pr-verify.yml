name: PR verify

# One verification path (ADR 0236). Every push to a pull request runs every lane
# its changed paths implicate, at full fidelity: quality, coverage-backed tests
# plus Fallow, the real-browser contracts, the Instant matrix, and the database
# replay. Path filtering still decides which lanes apply; no lane is ever
# deferred to a label or to a later run.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Path filtering happens in a job, not in a workflow-level `paths:` filter. A
  # workflow-level filter would stop the workflow from starting at all on a
  # documentation-only pull request, and the required checks below would sit on
  # "Expected" forever. Here the workflow always runs and each lane is skipped
  # individually, which GitHub reports as a successful required check.
  changes:
    name: Detect changes
    runs-on: >-
      ${{
        github.event.pull_request.head.repo.fork &&
        'ubuntu-latest' ||
        format('runs-on={0}-changes/runner=light', github.run_id)
      }}
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.filter.outputs.verify }}
      tests: ${{ steps.filter.outputs.tests }}
      browser: ${{ steps.filter.outputs.browser }}
      instant: ${{ steps.filter.outputs.instant }}
      database: ${{ steps.filter.outputs.database }}
    steps:
      - name: Set up RunsOn
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: runs-on/action@46910bf61b41721b0579f237e186afb35477007a # v2.3.0

      - name: Check paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            verify:
              - '.github/workflows/**'
              - '.github/rulesets/**'
              - '.fallowrc*'
              - 'apps/**'
              - 'packages/**'
              - 'public/**'
              - 'scripts/**'
              - 'biome.json'
              - 'components.json'
              - 'docker-compose.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
            tests:
              - '.github/workflows/**'
              - '.github/rulesets/**'
              - '.fallowrc*'
              - 'apps/**/*.{ts,tsx,js,mjs,cjs}'
              - 'apps/*/package.json'
              - 'packages/**/*.{ts,tsx,js,mjs,cjs}'
              - 'packages/*/package.json'
              - 'scripts/**/*.{ts,tsx,js,mjs,cjs}'
              - 'biome.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
            browser:
              - '.github/workflows/**'
              - 'apps/web/src/**'
              - 'apps/web/vitest.browser.config.ts'
              - 'apps/web/package.json'
              - 'packages/*/src/**'
              - 'packages/*/package.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
            instant:
              - '.github/workflows/**'
              - 'apps/web/src/**'
              - 'apps/web/tests/instant/**'
              - 'apps/web/public/**'
              - 'apps/web/next.config.ts'
              - 'apps/web/playwright.config.ts'
              - 'apps/web/package.json'
              - 'apps/agent/agent/**'
              - 'apps/agent/package.json'
              - 'packages/*/src/**'
              - 'packages/*/package.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            database:
              - '.github/workflows/**'
              - 'packages/db/src/schema/**'
              - 'packages/db/migrations/**'
              - 'packages/db/drizzle.config.ts'
              - 'packages/db/package.json'
              - 'package.json'
              - 'pnpm-lock.yaml'

  # Deliberately unconditional. The required checks are the reusable workflow's
  # own jobs, and a skipped caller job never creates them, so the pull request
  # would then wait on checks that can never arrive. Calling it always and
  # passing the filters through as inputs means a documentation-only pull
  # request still produces one skipped, and therefore successful, check per lane.
  verify:
    needs: changes
    uses: ./.github/workflows/reusable-verify.yml
    with:
      run_quality: ${{ needs.changes.outputs.verify == 'true' }}
      run_tests: ${{ needs.changes.outputs.tests == 'true' }}
      run_browser: ${{ needs.changes.outputs.browser == 'true' }}
      run_instant: ${{ needs.changes.outputs.instant == 'true' }}
      run_database: ${{ needs.changes.outputs.database == 'true' }}
