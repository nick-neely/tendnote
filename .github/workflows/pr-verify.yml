name: PR verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.filter.outputs.verify }}
    steps:
      - name: Check paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            verify:
              - '.github/workflows/**'
              - 'apps/**'
              - 'packages/**'
              - 'docs/**'
              - 'public/**'
              - 'README.md'
              - 'biome.json'
              - 'components.json'
              - 'docker-compose.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'

  verify:
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    uses: ./.github/workflows/reusable-verify.yml

  verify-skipped:
    name: Verify
    needs: changes
    if: needs.changes.outputs.verify != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: No verification needed
        run: echo "No application, package, workflow, or documentation paths changed."
