name: PR verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.filter.outputs.verify }}
      database: ${{ steps.filter.outputs.database }}
    steps:
      - name: Check paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            verify:
              - '.github/workflows/**'
              - '.fallowrc*'
              - 'apps/**'
              - 'packages/**'
              - 'public/**'
              - 'scripts/**'
              - 'biome.json'
              - 'components.json'
              - 'docker-compose.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
            database:
              - '.github/workflows/**'
              - 'packages/db/src/schema/**'
              - 'packages/db/migrations/**'
              - 'packages/db/drizzle.config.ts'
              - 'packages/db/package.json'
              - 'package.json'
              - 'pnpm-lock.yaml'

  verify:
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    uses: ./.github/workflows/reusable-verify.yml
    with:
      run_database: ${{ needs.changes.outputs.database == 'true' }}

  gate:
    name: Verify
    needs:
      - changes
      - verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check PR verification
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Change detection failed."
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.verify }}" == "true" && "${{ needs.verify.result }}" != "success" ]]; then
            echo "Verification was required but did not succeed. Result: ${{ needs.verify.result }}"
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.verify }}" != "true" ]]; then
            echo "No application, package, workflow, or CI script paths changed."
          fi

          echo "PR verification gate passed."
